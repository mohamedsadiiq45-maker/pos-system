services:
  - type: web
    name: pos-server
    runtime: node
    rootDir: packages/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: STOREFRONT_URL
        sync: false

